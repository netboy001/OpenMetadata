# Apache Shiro configuration for Fuseki security
# This integrates with UMetadata's authentication

[main]
# Allow anonymous read access, require auth for writes
anon = org.apache.shiro.web.filter.authc.AnonymousFilter
authcBasic = org.apache.shiro.web.filter.authc.BasicHttpAuthenticationFilter

# Use environment variables for credentials
[users]
# Default admin user - should be overridden in production
admin = ${FUSEKI_ADMIN_PASSWORD:-admin}, admin

# UMetadata service account for updates
umetadata = ${FUSEKI_UMETADATA_PASSWORD:-umetadata-secret}, writer

[roles]
admin = *
writer = update:*, upload:*, data:*

[urls]
/$/ping = anon
/$/stats/* = anon
/umetadata/sparql = anon
/umetadata/query = anon
/umetadata/update = authcBasic, roles[writer]
/umetadata/upload = authcBasic, roles[writer]
/umetadata/data = authcBasic, roles[writer]
/** = authcBasic, roles[admin]