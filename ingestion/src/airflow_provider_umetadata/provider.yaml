---
package-name: apache-airflow-providers-umetadata
name: UMetadata
description: |
    `UMetadata <https://u-metadata.org/>`__
versions:
  - 0.0.1

additional-dependencies:
  - apache-airflow>=1.1.10

integrations:
  - integration-name: UMetadata
    external-doc-url: https://u-metadata.org
    tags: [service]

hooks:
  - integration-name: UMetadata
    python-modules:
      - airflow_provider_umetadata.hooks.umetadata

connection-types:
  - hook-class-name: airflow_provider_umetadata.hooks.umetadata.UMetadataHook
    connection-type: umetadata
