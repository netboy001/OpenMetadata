clusterName: umetadata
swagger:
  resourcePackage: org.umetadata.service.webservice.resources
server:
  rootPath: '/api/*'
  applicationConnectors:
    - type: http
      port: 0
      uriCompliance: UNSAFE
  adminConnectors:
    - type: http
      port: 0
logging:
  level: INFO
  appenders:
    - type: console
      logFormat: "%level %logger{5} - %msg%n"
database:
  driverClass: org.postgresql.Driver
  user: test
  password:
  url: jdbc:postgresql://localhost:5432/umetadata
  # Optimized for single JVM with method-level parallelization
  # Dynamic factor 1.0 = ~8 threads on 8-core, need sufficient connections
  maxSize: 100
  minSize: 20
  initialSize: 20
  checkConnectionWhileIdle: true
  checkConnectionOnBorrow: true
  evictionInterval: 30 seconds
  minIdleTime: 10 seconds
  validationQuery: "SELECT 1"
  maxWaitForConnection: 30 seconds
migrationConfiguration:
  flywayPath: "../bootstrap/sql/migrations/flyway"
  nativePath: "../bootstrap/sql/migrations/native"
  extensionPath: ""
secretsManagerConfiguration:
  secretsManager: db
  tags: []
health:
  delayedShutdownHandlerEnabled: true
  shutdownWaitPeriod: 5s
  healthChecks:
    - name: UMetadataServerHealthCheck
      critical: true
authorizerConfiguration:
  className: "org.umetadata.service.security.DefaultAuthorizer"
  containerRequestFilter: "org.umetadata.service.security.JwtFilter"
  adminPrincipals:
    - "admin"
  testPrincipals:
    - "test"
  principalDomain: "wondersgroup.com"
  enforcePrincipalDomain: false
  enableSecureSocketConnection: false
  allowedEmailRegistrationDomains:
    - "all"
authenticationConfiguration:
  clientType: "public"
  provider: "umetadata"
  providerName: ""
  publicKeyUrls:
    - "https://www.googleapis.com/oauth2/v3/certs"
  authority: "https://accounts.google.com"
  clientId: "dummy"
  callbackUrl: "http://localhost:8585/callback"
  jwtPrincipalClaims:
    - "email"
    - "preferred_username"
    - "sub"
  enableSelfSignup : true
jwtTokenConfiguration:
  rsapublicKeyFilePath: "src/test/resources/public_key.der"
  rsaprivateKeyFilePath: "src/test/resources/private_key.der"
  jwtissuer: "wondersgroup.com"
  keyId: "test-key"
eventHandlerConfiguration:
  eventHandlerClassNames:
    - "org.umetadata.service.events.AuditEventHandler"
    - "org.umetadata.service.events.ChangeEventHandler"

eventMonitoringConfiguration:
  eventMonitor: "prometheus"
  batchSize: 10
  pathPattern: ["/*"]
  latency: [0.90]
pipelineServiceClientConfiguration:
  className: "org.umetadata.service.clients.pipeline.airflow.AirflowRESTClient"
  metadataApiEndpoint: http://localhost:8585/api
  apiEndpoint: http://localhost:8080
  hostIp: ""
  healthCheckInterval: 300
  verifySSL: "no-ssl"
  authProvider: "umetadata"
  parameters:
    username: admin
    password: admin
    timeout: 10
    truststorePath: ""
    truststorePassword: ""
fernetConfiguration:
  fernetKey: ihZpp5gmmDvVsgoOG6OVivKWwC9vd5JQ
objectStorage:
  enabled: false
  provider: NOOP
  maxFileSize: 5242880

# RDF Configuration - will be dynamically configured by TestSuiteBootstrap
rdf:
  enabled: false
  baseUri: "https://wondersgroup.com/"
  storageType: "FUSEKI"
  remoteEndpoint: "http://localhost:3030/umetadata"
  username: "admin"
  password: "test-admin"
  dataset: "umetadata"
